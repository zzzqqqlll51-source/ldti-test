<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西南联大 LDTI 精神检定</title>
  <style>
    :root {
      --bg: #f5efe2;
      --paper: rgba(252, 247, 238, 0.92);
      --ink: #2d241c;
      --muted: #6a5b4b;
      --line: #d5c4ab;
      --accent: #8b2e1f;
      --accent-2: #b24834;
      --gold: #8c6b2a;
      --shadow: 0 16px 40px rgba(60, 38, 14, 0.14);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      background:
        radial-gradient(circle at top, rgba(139,46,31,0.06), transparent 28%),
        linear-gradient(180deg, #f7f2e8 0%, #efe3cf 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    .bg-texture::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(80,50,20,0.02) 0px,
          rgba(80,50,20,0.02) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity: 0.5;
    }

    .app {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .card {
      position: relative;
      background: var(--paper);
      border: 1.5px solid rgba(139, 46, 31, 0.14);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(140, 107, 42, 0.16);
      border-radius: calc(var(--radius) - 10px);
      pointer-events: none;
    }

    .hero {
      padding: 44px 28px 36px;
      min-height: calc(100vh - 88px);
      display: grid;
      place-items: center;
    }

    .hero-inner {
      width: 100%;
      max-width: 760px;
      text-align: center;
      padding: 42px 24px 34px;
      background:
        linear-gradient(135deg, rgba(139,46,31,0.06), rgba(255,255,255,0) 45%),
        var(--paper);
    }

    .stamp {
      display: inline-block;
      color: var(--accent);
      border: 2px solid rgba(139,46,31,0.45);
      border-radius: 999px;
      padding: 6px 16px;
      letter-spacing: 0.18em;
      font-size: 12px;
      margin-bottom: 20px;
    }

    h1, h2, h3, p { margin: 0; }

    .title {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.18;
      letter-spacing: 0.06em;
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(16px, 2.6vw, 22px);
      color: var(--gold);
      letter-spacing: 0.12em;
    }

    .intro {
      margin: 26px auto 0;
      max-width: 620px;
      font-size: 17px;
      line-height: 1.9;
      color: var(--muted);
      text-align: justify;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    button:hover { transform: translateY(-1px); }

    .primary {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #fffaf4;
      padding: 14px 24px;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(139,46,31,0.22);
    }

    .secondary {
      background: rgba(139,46,31,0.06);
      color: var(--accent);
      padding: 14px 24px;
      border: 1px solid rgba(139,46,31,0.2);
      border-radius: 999px;
    }

    .panel {
      padding: 26px 22px 28px;
      margin-top: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .progress-text {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.06em;
    }

    .progress {
      width: min(320px, 100%);
      height: 10px;
      border-radius: 999px;
      background: rgba(139,46,31,0.08);
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--accent));
      border-radius: inherit;
      transition: width 0.28s ease;
    }

    .question-tag {
      display: inline-block;
      color: var(--accent);
      border-left: 4px solid var(--accent);
      padding-left: 10px;
      font-size: 14px;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .question-title {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.5;
    }

    .options {
      margin-top: 24px;
      display: grid;
      gap: 16px;
    }

    .option {
      text-align: left;
      padding: 18px 18px 18px 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.62);
      border: 1.5px solid rgba(139,46,31,0.12);
      box-shadow: 0 8px 20px rgba(60, 38, 14, 0.06);
      color: inherit;
      width: 100%;
    }

    .option:hover {
      background: rgba(255,255,255,0.95);
      border-color: rgba(139,46,31,0.28);
    }

    .option-code {
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .option-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .option-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.85;
    }

    .result-wrap {
      padding: 26px 22px 30px;
      margin-top: 18px;
    }

    .loading {
      text-align: center;
      padding: 70px 20px;
    }

    .loading h3 {
      font-size: 30px;
      margin-bottom: 16px;
    }

    .loading p {
      color: var(--muted);
      line-height: 1.9;
    }

    .dots::after {
      content: "";
      display: inline-block;
      width: 1em;
      text-align: left;
      animation: dots 1.2s steps(4, end) infinite;
      overflow: hidden;
      vertical-align: bottom;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    .result-header {
      display: grid;
      gap: 18px;
    }

    .result-topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .result-type {
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.18;
      letter-spacing: 0.08em;
    }

    .badge {
      border: 1.5px solid rgba(139,46,31,0.24);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      background: rgba(139,46,31,0.05);
      white-space: nowrap;
    }

    .result-person {
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 0.08em;
    }

    .quote-block, .skill-block, .similar-block, .share-block {
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.56);
      border: 1px solid rgba(139,46,31,0.1);
    }

    .judgement {
      font-size: 18px;
      line-height: 2;
      margin-top: 10px;
    }

    .section-label {
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .quote-text {
      font-size: 20px;
      line-height: 1.9;
      font-style: italic;
    }

    .small-text {
      color: var(--muted);
      line-height: 1.9;
      font-size: 15px;
    }

    .code-line {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .result-actions {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .hero { padding: 12px 0 30px; min-height: auto; }
      .hero-inner { padding: 34px 18px 28px; }
      .title { letter-spacing: 0.03em; }
      .panel, .result-wrap { padding: 20px 16px 22px; }
      .option-title { font-size: 20px; }
      .quote-text { font-size: 18px; }
    }
  </style>
</head>

      'BBBA': {
        type: '歌咏者', person: '穆旦',
        judgement: '你在野人山的死亡行军中幸存，用诗歌为一代青年立碑，让苦难有了不朽的回声。',
        quote: '这才知道我全部的努力，不过完成了普通的生活。',
        skill: '把战争写成诗，让和平年代的人出冷汗。',
        similar: '与你同一禀赋者——闻一多（燃灯）、汪曾祺（守藏）、费孝通（躬行）。你们把战争、死亡和流亡写成诗，让后来的人在和平年代读到时，依然会打个寒战。'
      },
      'BBBB': {
        type: '摘星者', person: '杨振宁',
        judgement: '你在茅草屋里和同学争论爱因斯坦，三十年后从斯德哥尔摩捧回了属于中国人的星辰。',
        quote: '宁拙毋巧，宁朴毋华。',
        skill: '从茅草屋到斯德哥尔摩，路径规划大师；锐评大师（那句“毫无创新”就是你说的）。',
        similar: '与你同一禀赋者——黄昆（拓荒）、邓稼先（筑盾）、赵忠尧（追光）。你们从茅草屋出发，走向世界最高的学术殿堂，然后告诉所有人：中国人，可以。'
      }
    };

    const state = {
      screen: 'home',
      step: 0,
      answers: [],
      loading: false,
      result: null
    };

    const app = document.getElementById('app');

    function render() {
      if (state.screen === 'home') return renderHome();
      if (state.screen === 'quiz') return renderQuiz();
      if (state.screen === 'result') return renderResult();
    }

    function renderHome() {
      app.innerHTML = `
        <section class="hero">
          <div class="card hero-inner">
            <div class="stamp">西南联大训导处 谨启</div>
            <h1 class="title">联大入学档案 · LDTI精神分选</h1>
            <p class="subtitle">刚毅坚卓检定报告</p>
            <p class="intro">
              同学惠鉴：时局板荡，学风愈坚。校务处特拟心志问卷四则，以观诸生秉性。请据实勾选，以便分科因材施教。<br>
              完成检定后，你将获得一份专属的联大精神档案，匹配与你气质相近的西南联大先贤人物。
            </p>
            <div class="actions">
              <button class="primary" onclick="startQuiz()">领取入学迁移证</button>
              <button class="secondary" onclick="scrollToHow()">先看说明</button>
            </div>
          </div>
        </section>

        <section id="how" class="card panel">
          <div class="question-tag">检定说明</div>
          <h2 class="question-title">四问定谱系，片刻见精神</h2>
          <div class="quote-block">
            <div class="section-label">说明</div>
            <p class="small-text">本检定共 4 题，每题 2 个选项。请选择更符合你直觉的一项。完成后将生成你的专属联大精神档案，并匹配一位与你气质相近的西南联大人物。</p>
          </div>
        </section>

        
      `;
    }

    function renderQuiz() {
      const q = questions[state.step];
      const progress = ((state.step + 1) / questions.length) * 100;
      app.innerHTML = `
        <section class="card panel">
          <div class="topbar">
            <div class="progress-text">LDTI 精神检定 · 第 ${state.step + 1} / ${questions.length} 题</div>
            <div class="progress"><span style="width:${progress}%"></span></div>
          </div>
          <div class="question-tag">${q.dim} 维度</div>
          <h2 class="question-title">${q.title}</h2>
          <div class="options">
            ${q.options.map(opt => `
              <button class="option" onclick="selectAnswer('${opt.key}')">
                <div class="option-code">选择 ${opt.key}</div>
                <div class="option-title">${opt.title}</div>
                <div class="option-desc">${opt.desc}</div>
              </button>
            `).join('')}
          </div>
          <div class="footer-note">提示：本测试更注重精神取向与气质代入，并非严格学术分类。请选择你最本能想选的一项即可。</div>
        </section>
      `;
    }

    function renderResult() {
      if (state.loading) {
        app.innerHTML = `
          <section class="card result-wrap">
            <div class="loading">
              <h3>档案调取中<span class="dots"></span></h3>
              <p>正在匹配联大精神谱系，请稍候。<br>训导处正在为你生成专属检定报告。</p>
            </div>
          </section>
        `;
        return;
      }

      const r = state.result;
      const code = state.answers.join('');
      const shareText = `我在西南联大LDTI精神检定中，被分入 ${r.type}·${r.person} 门下。\n“${r.quote}”\n你呢？来测测你是联大哪位先贤。`;

      app.innerHTML = `
        <section class="card result-wrap" id="result-card">
          <div class="result-header">
            <div class="result-topline">
              <div>
                <div class="code-line">联大入学档案 · 检定编码 ${code}</div>
                <h1 class="result-type">${r.type}</h1>
                <div class="result-person">代表人物：${r.person}</div>
              </div>
              <div class="badge">刚毅坚卓 检定完成</div>
            </div>
            <div class="quote-block">
              <div class="section-label">一句话判词</div>
              <p class="judgement">${r.judgement}</p>
            </div>
            <div class="quote-block">
              <div class="section-label">人物金句</div>
              <p class="quote-text">“${r.quote}”</p>
            </div>
            <div class="skill-block">
              <div class="section-label">隐藏技能</div>
              <p class="small-text">✨ ${r.skill}</p>
            </div>
            <div class="similar-block">
              <div class="section-label">同学录</div>
              <p class="small-text">${r.similar}</p>
            </div>
            <div class="share-block">
              <div class="section-label">分享文案</div>
              <p class="small-text" id="share-copy">我在西南联大LDTI精神检定中，被分入 <span style="color: var(--accent); font-weight: 700;">${r.type}·${r.person}</span> 门下。<br>“${r.quote}”<br>你呢？来测测你是联大哪位先贤。</p>
            </div>
          </div>
          <div class="result-actions">
            <button class="primary" onclick="saveReport()">保存检定报告</button>
            <button class="secondary" onclick="restartQuiz()">重新检定</button>
          </div>
        </section>
      `;
    }

    function startQuiz() {
      state.screen = 'quiz';
      state.step = 0;
      state.answers = [];
      state.loading = false;
      state.result = null;
      render();
    }

    function selectAnswer(key) {
      state.answers.push(key);
      if (state.step < questions.length - 1) {
        state.step += 1;
        render();
      } else {
        const code = state.answers.join('');
        state.screen = 'result';
        state.loading = true;
        render();
        setTimeout(() => {
          state.result = results[code];
          state.loading = false;
          render();
        }, 1300);
      }
    }

    function restartQuiz() {
      state.screen = 'home';
      state.step = 0;
      state.answers = [];
      state.loading = false;
      state.result = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function saveReport() {
      const card = document.getElementById('result-card');
      if (!card) return;

      try {
        const canvas = await html2canvas(card, {
          backgroundColor: '#fcf7ee',
          scale: Math.min(window.devicePixelRatio || 2, 3),
          useCORS: true
        });

        const link = document.createElement('a');
        const safeType = state.result ? state.result.type : 'LDTI';
        const safePerson = state.result ? state.result.person : 'report';
        link.download = `联大LDTI检定报告-${safeType}-${safePerson}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('保存失败，请直接使用系统截图。');
      }
    }

    function scrollToHow() {
      const el = document.getElementById('how');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      } else {
        window.scrollTo({ top: document.body.scrollHeight * 0.25, behavior: 'smooth' });
      }
    }

    window.startQuiz = startQuiz;
    window.selectAnswer = selectAnswer;
    window.restartQuiz = restartQuiz;
    window.saveReport = saveReport;
    window.scrollToHow = scrollToHow;

    render();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
